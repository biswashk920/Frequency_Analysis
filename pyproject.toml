[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "floodfreq"
version = "0.2.0"
description = "Flood frequency analysis: Gumbel, GEV, Log Normal and Log Pearson III with bootstrap bands, model ranking and Excel export"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0", "xlsxwriter>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7", "openpyxl>=3.1"]

[project.scripts]
floodfreq = "floodfreq.cli:main"

[tool.setuptools]
packages = ["floodfreq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
